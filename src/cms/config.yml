backend:
  name: git-gateway
  branch: main
media_folder: src/media/uploads
public_folder: /media/uploads
collections:
- name: pages
  label: Pages
  description: The homepage, projects index, our story, FAQ and contact. Each project page and its floor-plan pages are edited under Projects.
