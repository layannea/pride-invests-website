- name: inventory
  label: Apartment inventory
  description: The homes shown in the find your home search (one row per apartment).
  files:
  - file: src/_data/units.json
    name: units
    label: All homes (powers the Find-your-home search)
    fields:
    - name: units
      label: Units
      widget: list
      fields:
      - name: id
        label: ID (unique, no spaces)
        widget: string
      - name: name
        label: Name
        widget: string
      - name: project
        label: Project
        widget: string
      - name: location
        label: Location
        widget: string
      - name: type
        label: Type
        widget: select
        options:
        - Apartment
        - Duplex
        - Roof duplex
        - Mansion residence
      - name: size
        label: Interior size (m²)
        widget: number
      - name: garden
        label: Garden (m², 0 if none)
        widget: number
      - name: terrace
        label: Terrace (m², 0 if none)
        widget: number
      - name: beds
        label: Bedrooms
        widget: number
      - name: floor
        label: Floor
        widget: string
      - name: price
        label: Price (US$, empty = on request)
        widget: number
        required: false
      - name: url
        label: Link
        widget: string
      - name: sold
        label: Sold
        widget: boolean
        required: false
